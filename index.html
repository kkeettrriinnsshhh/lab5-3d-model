
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Интерактивная 3D-модель собак породы бигль">
  <title>Мир биглей в 3D</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <main class="page">
    <header class="header">
      <p class="eyebrow">ИНТЕРАКТИВНАЯ 3D-КОЛЛЕКЦИЯ</p>
      <h1>Мир биглей в 3D</h1>
      <p class="subtitle">
        Знакомьтесь с очаровательными биглями
        в стиле Low Poly
      </p>
    </header>

    <section class="viewer-card">
      <model-viewer
        src="05a6780c7a8942dc9d5d5dce756bff5e.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        tone-mapping="neutral"
        poster="poster.webp"
        shadow-intensity="1.24"
        exposure="0.88"
        shadow-softness="0.86"
        auto-rotate
        camera-orbit="-241.9deg 73.34deg 9.947m"
        field-of-view="30deg">

        <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
        </div>

        <button slot="ar-button" id="ar-button">
          Посмотреть в AR
        </button>

        <div id="ar-prompt">
          <img src="ar_hand_prompt.png" alt="Подсказка для AR">
        </div>

      </model-viewer>
    </section>

    <p class="hint">
      ↻ Вращайте модель мышью, чтобы рассмотреть собак со всех сторон
    </p>

    <footer>
      Лабораторная работа №5 · Интерактивная 3D-презентация
    </footer>
  </main>

  <script src="script.js"></script>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>
</body>
</html>
