
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дикая грация в 3D</title>
  <link rel="stylesheet" href="./styles.css">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>
</head>

<body>
  <main class="page">

    <header class="header">
      <p class="eyebrow">ИНТЕРАКТИВНАЯ 3D-КОЛЛЕКЦИЯ</p>
      <h1>Дикая грация в 3D</h1>
      <p class="subtitle">
        Познакомьтесь с грациозной кошкой
        в интерактивном 3D-пространстве
      </p>
    </header>

    <section class="viewer-card">
      <model-viewer
        id="cat-model"
        src="7791f88254194c91b6f9365f0c7595da.glb"
        alt="Реалистичная трёхмерная модель кошки"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        animation-name="Untitled"
        autoplay
        ar
        ar-modes="webxr scene-viewer quick-look">

        <button slot="ar-button" id="ar-button">
          Посмотреть в AR
        </button>

      </model-viewer>
    </section>

    <div class="animation-controls">
      <button id="play-btn">▶ Запустить анимацию</button>
      <button id="pause-btn">⏸ Остановить</button>
      <button id="restart-btn">↻ Повторить</button>
    </div>

    <p class="hint">
      Вращайте модель мышью, чтобы рассмотреть её
      со всех сторон. Для приближения используйте
      колёсико мыши.
    </p>

    <footer>
      Лабораторная работа №6 · Интерактивная 3D-анимация
    </footer>

  </main>

  <script>
    const model = document.querySelector('#cat-model');

    document.querySelector('#play-btn').addEventListener('click', () => {
      model.play();
    });

    document.querySelector('#pause-btn').addEventListener('click', () => {
      model.pause();
    });

    document.querySelector('#restart-btn').addEventListener('click', () => {
      model.currentTime = 0;
      model.play();
    });
  </script>
</body>
</html>
