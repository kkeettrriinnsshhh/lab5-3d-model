
<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дикая грация — кошка в 3D</title>
  <link rel="stylesheet" href="./styles.css">

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>
</head>

<body>
  <main class="page">

    <header class="header">
      <p class="eyebrow">ИНТЕРАКТИВНАЯ 3D-КОЛЛЕКЦИЯ</p>
      <h1>Дикая грация</h1>
      <p class="subtitle">
        Познакомьтесь с грациозной кошкой
        в интерактивном 3D-пространстве
      </p>
    </header>

    <section class="viewer-card">
      <model-viewer
        src="7791f88254194c91b6f9365f0c7595da.glb"
        alt="Реалистичная трёхмерная модель кошки"
        camera-controls
        auto-rotate
        auto-rotate-delay="1500"
        rotation-per-second="15deg"
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1"
        shadow-softness="0.9"
        exposure="1"
        tone-mapping="neutral"
        environment-image="neutral">

        <button slot="ar-button" id="ar-button">
          Посмотреть в AR
        </button>

      </model-viewer>
    </section>

    <p class="hint">
      ↻ Вращайте модель мышью, чтобы рассмотреть
      кошку со всех сторон
    </p>

    <footer>
      Лабораторная работа №5 · Интерактивная 3D-презентация
    </footer>

  </main>
</body>
</html>
